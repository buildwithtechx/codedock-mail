name: codedock-mail

services:
  maild:
    build: .
    image: ghcr.io/buildwithtechx/codedock-mail:latest
    environment:
      PORT: 8081
      DATABASE_URL: postgres://mail:mail@postgres:5432/mail?sslmode=disable
      MAIL_DOMAIN: ${MAIL_DOMAIN:-example.com}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.example.com}
      STALWART_URL: http://engine:8080
      STALWART_USER: ${STALWART_USER:-admin}
      STALWART_SECRET: ${STALWART_SECRET:?set STALWART_SECRET}
      MAILD_API_TOKEN: ${MAILD_API_TOKEN:?set MAILD_API_TOKEN}
    depends_on:
      - postgres
      - engine
    ports:
      - "8081:8081"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail
      POSTGRES_DB: mail
    volumes:
      - mail_db:/var/lib/postgresql/data
    restart: unless-stopped

  engine:
    image: stalwartlabs/stalwart:v0.15.5
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
    volumes:
      - ./deploy/stalwart.toml:/opt/stalwart/etc/config.toml:ro
      - stalwart_data:/opt/stalwart/data
    restart: unless-stopped

  webmail:
    image: djmaze/snappymail:2.38.2
    ports:
      - "8888:8888"
    volumes:
      - snappymail_data:/var/lib/snappymail
    restart: unless-stopped

volumes:
  mail_db:
  stalwart_data:
  snappymail_data:
