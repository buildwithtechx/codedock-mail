root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/maild.exe ./cmd/maild"
  entrypoint = ["./tmp/maild.exe"]
  include_dir = ["cmd", "internal", "apps"]
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["tmp", "bin", "data", "dist", "build", "node_modules", ".git", "apps/admin/node_modules", "apps/admin/dist", "apps/admin/public", "apps/docs", "apps/webmail-ext"]
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
